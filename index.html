<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Major Finder</title>
  <link rel="stylesheet" href="nor.css">
</head>

<body>
  <main class="quiz-container">
    <header class="quiz-header">
      <button id="languageBtn" class="language-btn">العربية</button>

      <h1 id="title">Find Your Best Computing Major</h1>

      <p id="subtitle">
        Answer the questions to find the specialty that suits you.
      </p>
    </header>

    <section id="quiz-box">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <p id="progressText"></p>

      <h2 id="question"></h2>

      <div id="answers-container" class="answers-container"></div>
    </section>

    <section id="result-box" class="hidden">
      <h2 id="resultTitle"></h2>
      <h1 id="result-specialty"></h1>
      <p id="result-desc"></p>

      <button id="restartBtn" class="btn-submit"></button>
    </section>
  </main>

  <script src="nor.js"></script>
</body>
</html>
