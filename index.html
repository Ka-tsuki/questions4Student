<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Major Finder</title>
  <link rel="stylesheet" href="nor.css" />
</head>
<body>
  <main class="container">
    <header>
      <button id="languageBtn" class="language-btn">العربية</button>
      <h1 id="title">Find Your Best Computing Major</h1>
      <p id="subtitle">Answer a few questions to discover the specialty that suits you.</p>
    </header>
    

    <section id="quizBox" class="quiz-box">
      <div class="progress-area">
        <span id="progressText"></span>
        <div class="progress-bar">
          <div id="progressFill"></div>
        </div>
      </div>

      <h2 id="questionText"></h2>
      <div id="answers" class="answers"></div>
    </section>

    <section id="resultBox" class="quiz-box hidden">
      <h2 id="resultTitle"></h2>
      <div id="resultContent"></div>
      <button id="restartBtn" class="restart-btn"></button>
    </section>
  </main>

  <script src="nor.js"></script>
</body>
</html>
